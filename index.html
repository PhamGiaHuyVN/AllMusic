<!-- FORM UPLOAD BÀI HÁT -->
<div class="card">
  <h2>Tải Lên Bài Hát Mới</h2>
  <input type="text" id="trackTitle" placeholder="Tên bài hát">
  <input type="text" id="trackArtist" placeholder="Nghệ sĩ">
  <input type="file" id="audioFile" accept="audio/*">
  <button type="button" onclick="uploadTrack(event)">Upload Bài Hát</button>
</div>

<!-- PLAYER PHÁT NHẠC -->
<div class="card">
  <h2>Trình Phát Nhạc</h2>
  <div id="trackList">Chưa có bài hát nào</div>
  <br>
  <audio id="audioPlayer" controls style="width: 100%; margin-top: 10px;"></audio>
</div>

<script>
  // Hàm Upload File lên Server
  async function uploadTrack(event) {
  if (event) event.preventDefault(); // Ngăn trình duyệt reload trang

  const title = document.getElementById('trackTitle').value;
  const artist = document.getElementById('trackArtist').value;
  const fileInput = document.getElementById('audioFile');

  if (!fileInput.files[0] || !title) return alert('Vui lòng điền đủ thông tin!');

  const formData = new FormData();
  formData.append('title', title);
  formData.append('artist', artist);
  formData.append('audio', fileInput.files[0]);

  try {
    const res = await fetch('http://localhost:3000/api/tracks/upload', {
      method: 'POST',
      body: formData
    });
    const result = await res.json();

    if (result.success) {
      alert('🎉 Upload bài hát thành công!');
      loadTracks();
    } else {
      alert('Lỗi: ' + result.message);
    }
  } catch (err) {
    console.error('Lỗi khi gửi request:', err);
  }
}

  // Hàm Lấy danh sách bài hát và phát
  async function loadTracks() {
    const res = await fetch('http://localhost:3000/api/tracks');
    const result = await res.json();
    const listDiv = document.getElementById('trackList');

    if (result.success && result.data.length > 0) {
      listDiv.innerHTML = result.data.map(track => `
        <div class="playlist-item" style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <b>${track.title}</b> - ${track.artist}
          </div>
          <button onclick="playAudio('${track.audioUrl}')">▶ Play</button>
        </div>
      `).join('');
    }
  }

  function playAudio(url) {
    const player = document.getElementById('audioPlayer');
    player.src = url;
    player.play();
  }

  // Tự động tải danh sách khi mở trang
  loadTracks();
</script>
