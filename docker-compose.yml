version: '3.8'

services:
    mongodb:
        image: mongo:7.0
        container_name: music_mongodb
        restart: always
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: root
        volumes:
            - mongo_data:/data/db
    
    redis:
        image: redis:alpine
        container_name: music_redis
        restart: always
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

volumes:
    mongo_data:
    redis_data: